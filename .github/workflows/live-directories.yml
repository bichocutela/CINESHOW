name: Sync public live directories
on:
  push:
    branches: [main]
    paths: ['tools/sync_live_sources.py', '.github/workflows/live-directories.yml']
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-directories
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Refresh verified source snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/sync_live_sources.py --output /tmp/live-snapshots --publish
