name: Validate and build CINESHOW
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: cineshow-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine official release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request, urllib.error
          from pathlib import Path
          version = re.search(r'^version:\s*(\S+)', Path('pubspec.yaml').read_text(), re.M).group(1).split('+')[0]
          tag = 'v' + version
          ref = os.environ['GITHUB_REF']
          publish = ref.startswith('refs/tags/v')
          if publish and ref != 'refs/tags/' + tag:
              raise SystemExit('Tag must match pubspec version')
          if ref == 'refs/heads/main' and os.environ['GITHUB_EVENT_NAME'] == 'push':
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/releases/latest',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      latest = json.load(response)['tag_name']
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  latest = 'v0.0.0'
              parts = lambda value: tuple(map(int, value.removeprefix('v').split('.')))
              publish = parts(tag) > parts(latest)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tag=' + tag + '\n')
              output.write('publish=' + str(publish).lower() + '\n')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Generate Android scaffold with permanent application id
        run: |
          flutter create --platforms=android --org=com.bichocutela --project-name=cineshow .
          python scripts/configure_android.py
      - run: flutter pub get
      - run: |
          dart format lib test
          git diff --exit-code -- lib test
      - run: flutter analyze
      - run: flutter test
      - run: python -m unittest discover -s tests -v
      - name: Configure permanent release signature
        if: steps.release.outputs.publish == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE" || { echo 'Configure the permanent Android signing secrets before publishing.'; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > android/release.jks
          python - <<'PY'
          import os
          from pathlib import Path
          values={'storeFile':'release.jks','storePassword':os.environ['STORE_PASSWORD'],'keyPassword':os.environ['KEY_PASSWORD'],'keyAlias':os.environ['KEY_ALIAS']}
          Path('android/key.properties').write_text('\n'.join(k+'='+v for k,v in values.items()))
          PY
      - name: Build validation APK
        if: steps.release.outputs.publish != 'true'
        run: flutter build apk --debug
      - name: Check version and build release APK
        if: steps.release.outputs.publish == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          API_URL: ${{ vars.CINESHOW_API_URL }}
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          version=re.search(r'^version:\s*(\S+)',Path('pubspec.yaml').read_text(),re.M).group(1)
          assert os.environ['TAG']=='v'+version.split('+')[0], 'Tag must match pubspec version'
          PY
          flutter build apk --release --dart-define="CINESHOW_API_URL=$API_URL"
          cp build/app/outputs/flutter-apk/app-release.apk "CINESHOW-${TAG}.apk"
          sha256sum "CINESHOW-${TAG}.apk" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cineshow-apk-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            CINESHOW-*.apk
            SHA256SUMS.txt
            lib/
            test/
          retention-days: 14
      - name: Publish installable release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CINESHOW-*.apk
            SHA256SUMS.txt
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: CINESHOW ${{ steps.release.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            Atualização oficial com a mesma assinatura permanente e o mesmo pacote Android.
            - Descobre os players reais de cada título, ignorando trailers e duplicatas.
            - Preserva opções que responderam quando outra falha.
            - Valida vídeo recebido em blocos pequenos de rede.
            - Xonados: localiza o vídeo do capítulo em uma sessão nova e abre mídia validada no player nativo.
            - Filmes: consulta os players pela API DooPlay, sem abrir a página completa do agregador.
            - Seleção de players retornados pela fonte e incorporação em uma página mínima de iframe.
            - Diferencia vídeo direto de player externo, que pode exigir anúncios ou verificação do provedor.
            - Atualiza as origens observadas das fontes e mantém assinatura e atualização dentro do app.
            A disponibilidade das transmissões e a compatibilidade dos players de terceiros dependem de cada fonte.
            Abra Sobre e verifique a atualização para baixar pelo próprio CINESHOW.
    permissions:
      contents: write
