name: Validate and build CINESHOW
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Generate Android scaffold with permanent application id
        run: |
          flutter create --platforms=android --org=com.bichocutela --project-name=cineshow .
          python scripts/configure_android.py
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - run: python -m unittest discover -s tests -v
      - name: Configure permanent release signature
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE" || { echo 'Configure the permanent Android signing secrets before publishing.'; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > android/release.jks
          python - <<'PY'
          import os
          from pathlib import Path
          values={'storeFile':'release.jks','storePassword':os.environ['STORE_PASSWORD'],'keyPassword':os.environ['KEY_PASSWORD'],'keyAlias':os.environ['KEY_ALIAS']}
          Path('android/key.properties').write_text('\n'.join(k+'='+v for k,v in values.items()))
          PY
      - name: Build validation APK
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: flutter build apk --debug
      - name: Check version and build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          API_URL: ${{ vars.CINESHOW_API_URL }}
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          version=re.search(r'^version:\s*(\S+)',Path('pubspec.yaml').read_text(),re.M).group(1)
          assert os.environ['TAG']=='v'+version.split('+')[0], 'Tag must match pubspec version'
          PY
          flutter build apk --release --dart-define="CINESHOW_API_URL=$API_URL"
          cp build/app/outputs/flutter-apk/app-release.apk "CINESHOW-${TAG}.apk"
          sha256sum "CINESHOW-${TAG}.apk" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cineshow-apk-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            CINESHOW-*.apk
            SHA256SUMS.txt
            lib/
            test/
          retention-days: 14
      - name: Publish installable release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CINESHOW-*.apk
            SHA256SUMS.txt
          generate_release_notes: true
    permissions:
      contents: write
